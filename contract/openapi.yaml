      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 60
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 30
          minimum: 1
          default: 15
          title: Limit
      - name: authorization
