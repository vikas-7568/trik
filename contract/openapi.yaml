openapi: 3.1.0
info:
  title: TrikMed API Contract
  version: 1.0.0
  description: 'SINGLE SOURCE OF TRUTH for every HTTP endpoint between frontend/ and backend/.

    Rules: (1) Change this file FIRST, then backend, then frontend. (2) No endpoint may exist in code that is not
    here; backend/tests/test_contract.py enforces it. (3) Endpoints marked x-trikmed-status: planned are agreed
    but not built yet.

    Baseline generated from the backend on 2026-10-11 (Trikmed_AI + CDCI + lab patches).'
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /ai/transcribe:
    post:
      tags:
      - AI Integration
      summary: Transcribe Audio
      description: Transcribe doctor speech to text using configured speech provider (adapter pattern).
      operationId: transcribe_audio_ai_transcribe_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_transcribe_audio_ai_transcribe_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Transcribe Audio Ai Transcribe Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai/structure-prescription:
    post:
      tags:
      - AI Integration
      summary: Structure Prescription
      description: Convert raw transcript into a validated structured prescription.
      operationId: structure_prescription_ai_structure_prescription_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StructureRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredPrescription'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '503':
          description: 'AI unavailable. UI shows: write the prescription manually. Never a fabricated draft.'
  /ai/voice-to-prescription:
    post:
      tags:
      - AI Integration
      summary: Voice To Prescription
      description: End-to-end voice to structured validated prescription.
      operationId: voice_to_prescription_ai_voice_to_prescription_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_voice_to_prescription_ai_voice_to_prescription_post'
      responses:
        '200':
          description: 'Successful Response. transcript is always the real Whisper output (or the
            caller-supplied transcript when no audio file is sent) — never modified, never lost.
            Transcription succeeding does not guarantee structuring succeeded: when the LLM is
            unavailable, prescription is null and error explains why, but the transcript the doctor
            actually said is still returned so it is never silently dropped.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceToPrescriptionResponse'
        '400':
          description: No speech or transcript was detected at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: 'Transcription itself failed (Whisper/speech provider down or no speech
            detected) — the only hard failure for this endpoint. Structuring failure is reported
            inside a 200 body instead; see VoiceToPrescriptionResponse.error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /drugs/search:
    get:
      tags:
      - Drugs
      summary: Search Drugs
      description: 'Typeahead for the doctor''s manual medicine search (CDCI). A medicine picked here is the

        doctor''s own choice: the frontend marks it source=''search'', doctor_confirmed=True.'
      operationId: search_drugs_drugs_search_get
