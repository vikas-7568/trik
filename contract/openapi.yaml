    VoiceToPrescriptionResponse:
      type: object
      required:
      - transcript
      - prescription
      - error
      description: 'Envelope for POST /ai/voice-to-prescription. transcript and prescription are
        reported independently: a transcription success with a structuring failure still returns
        the real transcript, with prescription=null and error set, status 200 — never a fabricated
        prescription (Fix Guide Fix 2), and never a lost transcript.'
      properties:
        transcript:
          type: string
          description: Exact Whisper transcription output, or the caller-supplied transcript when
            no audio file was sent. Never modified, never merged with any other text.
        prescription:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/StructuredPrescription'
          description: Null when structuring failed. Never present without error being null, and
            vice versa.
        error:
          type:
          - string
          - 'null'
          description: Set only when transcription succeeded but structuring failed (AIError from
            app/ai/adapter.py). Null on success.
        asr_model:
          type: string
        transcribe_latency_ms:
          type: number
        total_latency_ms:
          type:
          - number
          - 'null'
